<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lahan Parkir &mdash; Jalan Santai Dies Natalis ke-64 Unud</title>
<meta name="description" content="Peta lahan parkir Jalan Santai Dies Natalis ke-64 Universitas Udayana. Temukan lokasi parkir terdekat dan dapatkan arahan langsung ke sana.">
<link rel="icon" type="image/png" href="logo/logo.png">
<link rel="apple-touch-icon" href="logo/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-left">
    <img src="logo/logo.png" alt="Logo Unud" class="header-logo">
    <div class="title">
      <strong>Lahan Parkir</strong>
      <span>Jalan Santai Dies Natalis ke-64 &middot; Unud</span>
    </div>
  </div>
  <div class="qr-btn" id="shareBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
    <span>Share QR</span>
  </div>
</header>

<div id="map"></div>

<div class="fab-col">
  <div class="fab" id="recenterBtn" title="Lacak lokasi saya">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
  </div>
  <div class="fab" id="listBtn" title="Daftar lahan parkir">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
  </div>
</div>

<div id="detailContent" style="display:none;">
  <div class="photo-wrap" id="photoWrap">
    <div class="photo-loading" id="photoLoading"><div class="spinner"></div></div>
    <div class="photo-slider" id="photoSlider"></div>
    <div class="photo-fallback" id="photoFallback">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      <span>Foto belum tersedia</span>
    </div>
    <button class="photo-nav prev" id="photoPrev" aria-label="Foto sebelumnya">&#8249;</button>
    <button class="photo-nav next" id="photoNext" aria-label="Foto berikutnya">&#8250;</button>
    <div class="photo-dots" id="photoDots"></div>
  </div>
  <div class="detail-body">
    <h3 id="detailName">&ndash;</h3>
    <p class="sub" id="detailNotes" style="display:none;"></p>
    <div class="detail-dist" id="detailDist">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12A7 7 0 0 0 5 9c0 4.42 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
      <span id="detailDistText"></span>
    </div>
    <button class="btn primary" id="directionsBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Arahkan ke Sini
    </button>
  </div>
</div>

<div class="modal-back center" id="listModal">
  <div class="modal">
    <button class="close" id="closeList" aria-label="Tutup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <h3>Daftar Lahan Parkir</h3>
    <p class="sub">Tap salah satu untuk melihat di peta.</p>
    <ul class="parking-list" id="parkingList"></ul>
  </div>
</div>

<div class="modal-back center" id="shareModal">
  <div class="modal">
    <button class="close" id="closeShare" aria-label="Tutup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <h3>Bagikan Map Parkir</h3>
    <p class="sub">Scan kode ini untuk membuka Map Parkir di perangkat lain.</p>
    <div id="qrcode"></div>
    <div class="url-box" id="urlBox"></div>
    <div class="share-actions">
      <button class="copy-btn secondary" id="downloadBtn">Unduh QR</button>
      <button class="copy-btn" id="copyBtn">Salin Link</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="qr-generator.js"></script>
<script src="app.js"></script>
</body>
</html>
